openapi: 3.0.3
info:
  title: AI Content API
  version: 1.0.0
  description: |
    Asynchronous product descriptions. All dates and periods use UTC.
    A deterministic fake provider is enabled by default.
    Tokens require generations:read or generations:write, depending on the endpoint.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Generations
  - name: Usage
paths:
  /generations:
    post:
      tags: [Generations]
      operationId: createGeneration
      summary: Create a generation
      description: |
        Requires generations:write. Limited to 10 requests per minute per user.
        An identical user/key/input combination returns the existing generation (200).
        Reusing the key with different input returns 409. Feature order is significant.
        Key uniqueness is case-sensitive and lasts for the lifetime of the generation row.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 100
            pattern: '^[A-Za-z0-9._:-]+$'
          example: product-description-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationInput'
      responses:
        '202':
          description: Persisted and accepted for background processing
          headers:
            Location:
              schema: { type: string, format: uri }
              description: URL for polling this generation
            Idempotency-Replayed:
              schema: { type: string, enum: ['false'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEnvelope'
        '200':
          description: Existing generation, with its current state
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ['true'] }
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Key already used with different input
          content:
            application/json:
              schema:
                type: object
                required: [message, code]
                properties:
                  message: { type: string }
                  code: { type: string, enum: [idempotency_conflict] }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Generations]
      operationId: listGenerations
      summary: List the current user's generations
      description: |
        Requires generations:read. Read endpoints share 120 requests per minute per user.
        Ordered by created_at DESC, id DESC. Follow links.next for cursor pagination.
        from and to are inclusive calendar dates in UTC.
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/GenerationStatus' }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Cursor-paginated history
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Generation' }
                  links:
                    type: object
                    properties:
                      next: { type: string, nullable: true }
                      prev: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      path: { type: string }
                      per_page: { type: integer }
                      next_cursor: { type: string, nullable: true }
                      prev_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /generations/{id}:
    get:
      tags: [Generations]
      operationId: getGeneration
      summary: Read status and result
      description: Requires generations:read. Missing and other users' generations both return 404.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
          example: 01JC9KQZPCG4SD0KQ0G9RMBFVT
      responses:
        '200':
          description: Current state, directly from MySQL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Generation not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      summary: Usage statistics for the current user
      description: |
        Requires generations:read. Dates refer to generation creation, not attempt completion.
        Defaults to the last 30 calendar days, including today; maximum 93 days.
        Cached per user and date range for 60 seconds. Unknown provider usage is counted
        separately; reported token totals are not an invoice or a billing guarantee.
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistics, possibly up to 60 seconds old
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token; create locally with php artisan demo:token
  schemas:
    GenerationInput:
      type: object
      required: [product_name, features, language, tone]
      properties:
        product_name:
          type: string
          minLength: 1
          maxLength: 200
          example: Travel mug
        features:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 300 }
          example: [Steel, 350 ml]
        language: { type: string, enum: [ru, en] }
        tone: { type: string, enum: [neutral, friendly, professional] }
    GenerationStatus:
      type: string
      enum: [queued, processing, succeeded, failed]
    GenerationEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Generation' }
    Generation:
      type: object
      required: [id, status, input, provider, model, result, attempts, error, created_at, completed_at]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        status: { $ref: '#/components/schemas/GenerationStatus' }
        input: { $ref: '#/components/schemas/GenerationInput' }
        provider: { type: string, enum: [fake, openai] }
        model: { type: string }
        result: { type: string, nullable: true }
        attempts: { type: integer, minimum: 0, maximum: 3 }
        error:
          type: object
          nullable: true
          required: [code]
          properties:
            code:
              type: string
              enum:
                - rate_limited
                - quota_exceeded
                - provider_rejected
                - provider_not_configured
                - provider_configuration_changed
                - outcome_unknown
                - incomplete_response
                - invalid_provider_response
                - attempts_exhausted
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    Usage:
      type: object
      required: [period, total, succeeded, failed, pending, input_tokens, output_tokens, attempts_with_unreported_usage, generated_at]
      properties:
        period:
          type: object
          required: [from, to, timezone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string, enum: [UTC] }
        total: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        attempts_with_unreported_usage: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
  responses:
    Unauthorized:
      description: Missing, invalid or expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Forbidden:
      description: Token does not have the required ability
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    ValidationFailed:
      description: Invalid input or headers
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    RateLimited:
      description: Per-user request limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until another request is allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
